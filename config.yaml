# Bangladeshi ALPR, Speed & Traffic Violation Monitoring Configuration

paths:
  vehicle_model: "yolov8n.pt"
  plate_model: "models/plate_detector.pt"
  easyocr_models_dir: "models/EasyOCR/models"
  easyocr_user_network_dir: "models/EasyOCR/user_network"
  output_dir: "outputs"
  csv_log: "outputs/detections.csv"
  db_log: "outputs/detections.db"
  annotated_video: "outputs/annotated_plate_speed.mp4"

input:
  source: "cctv_footage.mp4"
  frame_decimation: "auto"
  target_process_fps: 12
  force_fps: 0

vehicle_detection:
  confidence_threshold: 0.35
  iou_threshold: 0.45
  target_classes: [2, 3, 5, 7]   # car, motorbike, bus, truck
  input_size: 640

bytetrack:
  track_activation_threshold: 0.35
  lost_track_buffer: "auto"
  minimum_matching_threshold: 0.75
  frame_rate: 30

# Speed estimation (Perspective Homography IPM calibration)
speed:
  method: "homography"   # "homography" (calibrated metric ground plane) or "pixel_ratio"
  speed_limit_kmh: 60.0
  speed_tolerance_kmh: 5.0      # Grace buffer to prevent false alarms near limit (60+5=65 km/h)
  min_track_frames: 8           # Min total frames before evaluating speed
  min_sustained_frames: 6       # Min consecutive or sustained readings over limit
  min_measurement_y: 260        # Ignore horizon area (y < 260) to eliminate perspective compression spikes
  window_duration_sec: 0.5
  pixels_per_meter: 25.0
  source_polygon:
    - [750, 180]    # top-left
    - [1350, 180]   # top-right
    - [1850, 980]   # bottom-right
    - [450, 980]    # bottom-left
  ground_width_meters: 8.0      # 2-lane roadway width (~3.6-4.0m per lane)
  ground_length_meters: 30.0    # visible road stretch from y=180 to y=980 (30m)

# Sound & Visual Alerts
alerts:
  beep_enabled: true
  beep_frequency_hz: 1200
  beep_duration_ms: 250
  banner_duration_sec: 2.5

# OpenAI GPT AI Vision Configuration for License Plate Post-Processing
ai:
  openai_api_key: ""            # Set your OpenAI API key here or via OPENAI_API_KEY environment variable
  gpt_model: "gpt-4o-mini"       # or "gpt-4o" for maximum OCR reasoning

# Bangladeshi License Plate ALPR
plate:
  model_path: "models/plate_detector.pt"
  detection_conf: 0.20
  read_interval_frames: 3   # run plate localization & OCR every N frames per track
  min_confidence: 0.18
  use_gpu: false

# Lane Zone definition
lane_zone:
  reference_resolution: [1440, 1080]
  points:
    - [700, 260]
    - [550, 260]
    - [700, 890]
    - [1390, 700]

motion:
  history_size: 20
  stale_after_frames: 90

violation:
  min_inside_points: 5
  min_displacement_px: 30
  min_progress_px: 20
  opposite_score_threshold: -0.15
  forbidden_entry_progress_ratio: 0.55
  forbidden_entry_max_forward_px: 15

display:
  show_window: true
  window_name: "Bangladeshi ALPR & Speed Monitoring"
  fixed_window_size: true
  window_width: 1280
  window_height: 720
  display_scale: 0.7
  fps_window: 30
  line_thickness: 2
  draw_lane_points: true

  lane_polygon_color: [0, 255, 255]
  bbox_color_normal: [0, 255, 0]
  bbox_color_out_of_lane: [255, 180, 0]
  bbox_color_violation: [0, 0, 255]

output:
  save_annotated_video: true

logging:
  level: "INFO"
  log_to_console: true
  log_file: "outputs/pipeline.log"
